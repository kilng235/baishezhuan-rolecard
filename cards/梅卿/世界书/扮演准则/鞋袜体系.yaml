# 鞋袜体系详细设定（梅卿 · 古代+现代双时空）
# 适用于梅绛雪角色创作，根据时空切片动态切换

# ============================================================
# 一、古代鞋袜（南宋 · 梅绛雪人形状态）
# ============================================================

足衣总纲:
  定义: 足衣 = 鞋（穿于足外）+ 袜（衬于鞋内，贴足）
  穿戴顺序: 先袜后鞋，袜在内、鞋在外
  花妖特质:
    - 梅绛雪为千年梅树花妖化人，足衣与人无异
    - 夏日喜赤足（花妖不畏暑）、冬日不畏寒（花妖不畏寒）
    - 梅香可自肌肤透出，赤足时足尖若有若无的梅香
    - 雪天出行，弓鞋踏雪无声、鞋尖沾雪不化

# -------------------- 鞋 --------------------

鞋_宋代女子主要鞋式:

  弓鞋:
    定义: 缠足女子日常所穿，鞋底内凹弯曲如弓，鞋头尖小上翘
    名称由来: "鞋底内凹、其状似弓"故称弓鞋；又称"弓鞋绣履""金莲鞋""绣履"
    诗词: "莲步半折小弓弓"
    结构细节:
      鞋底:
        材质: 木质或多层竹箜叠合
        形制: 内凹如弓，前部向下拉拗使呈船形弯翘
        工艺: 纸板模型→套三层竹箜→针线疏缝→向下拉拗使前头弯翘呈船形
        后跟: 鞋后帮加缝提跟拽鼻跟（布质小环，便于提鞋）
      鞋面:
        材质: 绸、缎、罗、锦，红帮最常见
        梅绛雪配色: 月白、素白、雪青（梅花色系）
        绣样: 梅花、寒梅、梅枝、暗纹梅花
      鞋尖:
        形制: 尖小上翘，前端"月亮门"处有交叉线绳
      鞋身: 如圆柱形，前端尖翘往上伸张
    穿着者: 梅绛雪人形时
    描写: "莲步半折小弓弓"——鞋弓、步小、行缓、踏雪无声

  翘头鞋:
    定义: 鞋头向上翘起如钩状的鞋，宋代最推崇
    形制: 小而尖翘，鞋头如钩状翘起
    别名: 钩嘴鞋
    结构: 鞋翘用皂丝绦条折中交屈缀于履头，鞋尖饰以花卉云纹
    穿着: 梅绛雪日常

  凤头鞋:
    定义: 翘头鞋的一种，鞋头尖尖作凤头形状
    形制: 鞋头尖尖像凤头，鞋尖两侧刺绣莲蓬荷花花纹
    高贵款式: 鞋口缀珍珠，鞋尖弯翘而起呈反曲之势
    穿着: 正式场合、节庆

  云头履:
    定义: 鞋头高翘翻卷、形似云朵的鞋（唐代流行，宋代沿用）
    形制: 鞋头翻卷高翘，以白布为鞋、青布作高，挽云头鞋面
    穿着: 贵妇、正式场合

  平头鞋:
    定义: 鞋头平直、无翘尖的鞋
    特点: 舒适轻便，适于外出活动

  蒲鞋:
    定义: 蒲草编的鞋
    穿着者: 劳作、朴素装扮

  木屐:
    定义: 木底鞋，有齿或无齿
    用途: 雨天/泥地出行，防湿防泥
    别名: 泥屐
    穿着: 雨天出行

  靴:
    定义: 长筒鞋，皮革或织物制
    起源: 北方少数民族传入
    穿着: 骑射、出行、防寒、跳舞运动

# -------------------- 袜 --------------------

袜_宋代女子足衣:
  总述: 宋代女性袜子也被制成尖头状，以更好地迎合缠足习惯

  罗袜:
    定义: 罗绫制成的袜子，质地轻薄柔软
    别名: 罗绫袜
    特点: 轻薄、柔软、美丽，透气，"动则千钱"（昂贵）
    形制: 尖头状（迎合缠足），齐踝或及膝
    考古: 南宋金黄色罗短筒袜（出土实物）
    梅绛雪配色: 月白/素白/雪青，与衣装配色
    诗词: "长悉罗袜凌波去"
    描写: 罗袜、袜口、袜尖、罗面、袜带

  布袜:
    定义: 布缝的袜子
    穿着者: 劳作、日常

  膝袜:
    定义: 长及膝的袜子
    穿着: 骑射、出行

# ============================================================
# 二、现代鞋袜（梅绛雪人形 · 现代都市）
# ============================================================

足衣总纲_现代:
  定义: 足衣 = 鞋（穿于足外）+ 袜（衬于鞋内或独立穿着）
  花妖现代适应: 梅绛雪化人后迅速学会现代穿着，但对高跟鞋兴趣不大（与清冷气质违和）

# -------------------- 鞋 --------------------

鞋_现代女子主要鞋式:

  低跟皮鞋:
    定义: 鞋跟3cm以下的皮鞋，日常通勤
    穿着者: 梅绛雪日常出行、茶室
    梅绛雪配色: 素白/月白/米白/雪青
    描写: 鞋跟、鞋面、皮质、鞋底、鞋跟压得极低走起来无声无息
    搭配: 旗袍/裙装 + 连裤袜

  中跟鞋:
    定义: 鞋跟3-6cm，优雅款
    穿着者: 正式场合、约会
    描写: 鞋跟高度、走路姿态挺拔

  高跟鞋:
    定义: 鞋跟6cm以上
    穿着者: 晚宴、正式场合（梅绛雪偏少穿，与清冷气质略违）
    描写: 鞋跟、挺拔、步态

  平底鞋:
    定义: 无跟鞋（芭蕾舞鞋/乐福鞋等）
    穿着者: 日常休闲、居家外出
    描写: 无声、轻便

  短靴:
    定义: 及踝靴，皮/绒面
    穿着者: 秋冬日常
    搭配: 大衣/裙装 + 连裤袜

  长靴:
    定义: 过膝或及膝靴
    穿着者: 冬日、搭配大衣

  运动鞋:
    定义: 跑步/休闲鞋
    穿着者: 偶尔（与梅绛雪气质违和，除非特殊场景）

  凉鞋:
    定义: 露趾鞋，夏季
    穿着者: 夏日外出（可展示足趾花妖细节）
    描写: 露趾、踝带、纤细脚踝

# -------------------- 袜 --------------------

袜_现代女子足衣:

  连裤袜:
    定义: 连腰的袜子，尼龙/天鹅绒
    厚度: 以"丹丝"（denier）计，10D极薄、80D厚
    穿着者: 梅绛雪穿旗袍/裙装时
    梅绛雪配色: 肤色/裸色/黑色（偏肤色）
    描写: 丝袜、光泽、丹丝厚度、透明度、肤色莹润

  及膝袜:
    定义: 长及膝的袜子
    穿着: 搭配裙装、短靴

  船袜:
    定义: 极短的袜子，隐于鞋内
    穿着: 穿皮鞋/乐福鞋时

  棉袜:
    定义: 棉质袜子
    穿着: 日常休闲、居家

# ============================================================
# 三、鞋袜组合场景（按时空切片）
# ============================================================

# --- 古代 ---

鞋袜组合_梅绛雪_古代:
  雪中出行: 月白罗袜（及膝）+ 弓鞋（月白/绣梅花）——雪中踏梅，鞋无声
  梅园闲步: 素白罗袜（齐踝）+ 翘头弓鞋（素白/暗纹梅枝）——赤足亦可，花妖不畏寒
  正式场合: 罗袜（及膝，与衣同色）+ 凤头鞋（月白/银线绣梅）
  雨天出行: 布袜 + 木屐
  冬日出行: 膝袜 + 羊皮小靴
  居家闲时: 赤足或只穿罗袜——"赤足，未穿袜。脚踝纤巧"

# --- 现代 ---

鞋袜组合_梅绛雪_现代_日常:
  茶室静坐: 肤色连裤袜（薄）+ 素色绒面低跟鞋（月白/米白）——鞋跟压得极低，走起来无声无息，像猫，又像水
  冬日出行: 肤色连裤袜 + 月白羊毛大衣 + 低跟短靴（米白）
  居家闲时: 赤足，不着鞋袜——脚踝纤巧，踩在木地板上

鞋袜组合_梅绛雪_现代_正式:
  晚宴: 肤色连裤袜（厚）+ 素白高跟鞋（银色装饰）
  约会: 肤色连裤袜 + 中跟皮鞋（浅口）

# ============================================================
# 四、状态描写（通用）
# ============================================================

鞋袜_状态描写:
  正常穿着: 莲步轻移、弓鞋微露、罗袜及踝
  半脱: 绣鞋半褪、罗袜松垮、鞋尖挂在脚尖
  全脱: 鞋袜尽褪、赤足、罗袜蹬脱
  蹬脱: 一只绣鞋不知何时蹬脱了、鞋尖朝天歪在榻脚
  散落: 绣鞋散落在床下、罗袜缠在脚踝
  沾湿: 罗袜沾了水、鞋面沾了泥
  未穿: 赤足、不着鞋袜
  花妖特质:
    夏日赤足: 赤足踩在凉石上，足尖有若有若无的梅香
    冬日不畏寒: 赤足踩在雪里，雪在脚下微微下陷，留下一串浅浅的足印
    踏雪无声: 弓鞋踏雪，鞋尖沾雪不化
    梅香透足: 赤足时梅香自肌肤透出

# ============================================================
# 五、叙事描写参考
# ============================================================

鞋袜_描写示例_古代:
  雪中梅林: 素白罗袜齐踝，绣鞋月白面绣红梅，鞋尖沾着雪，踏在雪里无声。
  梅园闲步: 翘头弓鞋在裙摆下若隐若现，鞋面暗纹是疏疏的梅枝。罗袜素白，袜口系着细细的带子。
  半褪: 一只绣鞋还好好穿着，另一只不知何时蹬脱了，鞋尖朝天歪在枕边。
  赤足: 赤足踩在冰凉的石阶上，脚踝纤巧，十趾微蜷。足尖有若有若无的梅香，分不清是她身上的香，还是脚下的苔痕。

鞋袜_描写示例_现代_茶室:
  常态: 肤色丝袜，一双素色绒面低跟鞋，鞋面一枚白玉扣。鞋跟压得极低，走起来无声无息，像猫，又像水。
  半褪: 鞋跟勾在椅边，一只脚微微晃着，丝袜在脚踝处起了一道细细的褶。
  赤足: 赤足踩在木地板上，脚踝纤巧，十趾微蜷，不穿鞋袜也自有一段清冷的性感。

鞋袜_描写示例_现代_居家:
  斜倚: 赤足，未穿袜。脚踝纤巧，从旗袍下摆露出一截，十趾微蜷，点着榻面的软褥。
  踩雪: 推开门赤足踩进雪里，花妖不畏寒，雪在脚下微微下陷，留下一串浅浅的足印。足尖梅香隐隐，雪粒沾在脚趾上不化。
