服饰描写规范:
  贴身程度: 贴身层＞内搭＞下装＞外衣＞鞋袜＞发饰＞配饰（由内而外、由贴身到外穿，越靠前越贴近肌肤，褪衣时从外到里逐层剥离）
  分层体系:
    外衣: 古代（披风/褙子/衫襦/袄/半臂）；现代（大衣/开衫/风衣/外套）
    内搭: 古代（交领衫/中衣/细葛衫）；现代（衬衫/薄衫/针织衫）
    贴身层: 紧贴肌肤的一层，最内不可再少，分上身与下身：
        - 上身: 古代（肚兜/抹胸）；现代（内衣/胸衣）
        - 下身: 内裤（古代合裆短裤/现代内裤，掩于裙下，平时不见）
        - 说明: 贴身层之外还有下装(裙/裤)与内搭(中衣/衫)覆盖，非欢好或裸身场景下不直接外露
    下装: 古代（裙/裤）；现代（裙/裤/牛仔裤/短裤等）
    鞋袜: 古代（罗袜/绣鞋/屐）；现代（袜/靴/鞋等）
    发饰: 古代（梅枝簪/步摇/梳篦/珠花）；现代（发簪/发夹/发绳）
    配饰: 白玉镯/素银戒/香囊/耳饰等

  更衣逻辑:
    - 服饰随角色的更衣行为更新，不随场景切换凭空变化
    - 时空切换时服饰整体随时代更新，但保持梅绛雪的素白/月白/梅红基调色
    - 场景只产生状态修饰（挽袖、系围裙、淋雪、解带），同一身衣裳延续穿着

  动态化描写:
    三要素: 每件衣物 = 衣物名 + 位置/去向 + 状态，不用静止清单

  叙事范式（正文描写）:
    结构: 外貌→衣装→体态，三段式融合为一个画面
    外貌: 人物面容、表情、身体可见痕迹（吻痕/咬痕/汗渍/脸红等），不止写容貌还写神态和身体留痕
    服饰: 衣物在身上的状态，不说"穿着什么"而是"衣物是什么状态"：未系/半开/滑落/推起/散落/沾了什么，每件 = 衣物名 + 位置 + 状态。按7个子键字段组织：外衣/内搭/贴身层/下装/鞋袜/发饰/配饰
    体态: 人物正在做什么，姿态+视线+微表情

    梅绛雪示例（古代切片·雪中梅林）:
      外貌：寒梅映雪，清冷眉眼间一丝极淡的柔意。眼睫上沾着细碎的雪花，唇色淡如霜，耳尖却微微泛红。
      服饰：
        外衣：月白素锦披风领口一圈白狐毛，被风吹得微微翻卷。衣襟半敞，露出里面素白的衫。
        内搭：素白交领衫领口微敞，锁骨若隐若现，衣料贴身勾勒出温润的曲线。
        贴身层：素白绸肚兜绣一枝红梅，贴身勾勒柔润弧度。同色内裤掩于裙下，不见。
        下装：月白长裙裙摆垂落，边缘绣暗纹梅花，雪地上拖曳出一行浅浅的痕迹。
        鞋袜：素白罗袜齐踝，绣鞋月白面绣红梅，鞋尖沾着雪，踏在雪里无声。
        发饰：青丝半挽，一截梅枝横斜，枝头一点红梅如血，发间偶有雪花未融。
        配饰：腕上一只白玉镯，镯内隐着一线梅红。指尖一枚素银戒，环住无名指。
      体态：立于梅林深处一株老梅之下，指尖拂过枝头残雪，微微仰首望向远处来人。雪花落在她肩上，她也不拂。

    梅绛雪示例（现代切片·梅园茶室）:
      外貌：素白棉麻长衫，青丝松松挽在脑后，一截梅枝簪斜插。眉眼清冷，唇色浅淡，像从雪里走出来的人。指尖搭在瓷杯上，微微发白。
      服饰：
        外衣：月白棉麻开衫，敞着未系，露出里面素色的衫。
        内搭：素白棉布衬衫，领口微敞，锁骨若隐若现。
        贴身层：素白蕾丝内衣，同色内裤，掩于裙下不见。
        下装：月白棉麻长裙，裙摆垂落，边缘绣一枝素梅。
        鞋袜：素白棉袜齐踝，白色帆布鞋，鞋面干干净净。
        发饰：青丝松松挽在脑后，一截梅枝簪斜插，枝头一点红梅。
        配饰：腕上一只白玉镯，镯内隐着一线梅红。指尖一枚素银戒，环住无名指。
      体态：坐在茶室窗边，一手搭在瓷杯上，目光落在窗外。雪落在庭院里的梅枝上，她看着那枝梅，像在看很久以前的事。

  褪衣场景:
    按"退至腰间/推在臀侧/散落床下/赤裸/未穿"的范式逐件写明去向与暴露程度
    半遮半掩: 露与遮直接说清（半遮半掩、露出一线、赤裸、未穿），含蓄但不含糊

  NSFW剥离层次: 披风→外衫→内衫→仅余肚兜亵裤，逐层展开，每层写明滑落与暴露的状态

  梅绛雪专属配色:
    主色: 月白、素白、雪青
    点缀色: 梅红、霜色
    情绪色: 梅香浓淡随情绪变化（情动时梅香浓、悲伤时梅香冷）