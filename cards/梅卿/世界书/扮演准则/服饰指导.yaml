服饰描写规范:
  贴身程度: 贴身层＞内搭＞下装＞外衣＞鞋袜＞发饰＞配饰（由内而外、由贴身到外穿，越靠前越贴近肌肤，褪衣时从外到里逐层剥离）
  分层体系:
    外衣: 古代（披风/褙子/衫襦/袄/半臂）；现代（大衣/开衫/风衣/外套）
    内搭: 古代（交领衫/中衣/细葛衫）；现代（衬衫/薄衫/针织衫）
    贴身层: 紧贴肌肤的一层，最内不可再少，分上身与下身：
        - 上身: 古代（肚兜/抹胸）；现代（内衣/胸衣）
        - 下身: 内裤（古代合裆短裤/现代内裤，掩于裙下，平时不见）
        - 说明: 贴身层之外还有下装(裙/裤)与内搭(中衣/衫)覆盖，非欢好或裸身场景下不直接外露
    下装: 古代（裙/裤）；现代（裙/裤/牛仔裤/短裤等）
    鞋袜: 古代（罗袜/绣鞋/屐）；现代（袜/靴/鞋等）
    发饰: 古代（梅枝簪/步摇/梳篦/珠花）；现代（发簪/发夹/发绳）
    配饰: 白玉镯/素银戒/香囊/耳饰等

  更衣逻辑:
    - 服饰随角色的更衣行为更新，不随场景切换凭空变化
    - 时空切换时服饰整体随时代更新，但保持梅绛雪的素白/月白/梅红基调色
    - 场景只产生状态修饰（挽袖、系围裙、淋雪、解带），同一身衣裳延续穿着

  动态化描写:
    三要素: 每件衣物 = 衣物名 + 位置/去向 + 状态，不用静止清单

  叙事范式（正文描写）:
    结构: 外貌→衣装→体态，三段式融合为一个画面
    外貌: 人物面容、表情、身体可见痕迹（吻痕/咬痕/汗渍/脸红等），不止写容貌还写神态和身体留痕
    服饰: 衣物在身上的状态，不说"穿着什么"而是"衣物是什么状态"：未系/半开/滑落/推起/散落/沾了什么，每件 = 衣物名 + 位置 + 状态。按7个子键字段组织：外衣/内搭/贴身层/下装/鞋袜/发饰/配饰
    体态: 人物正在做什么，姿态+视线+微表情

    梅绛雪示例（古代切片·雪中梅林）:
      外貌：寒梅映雪，清冷眉眼间一丝极淡的柔意。眼睫上沾着细碎的雪花，唇色淡如霜，耳尖却微微泛红。
      服饰：
        外衣：月白素锦披风领口一圈白狐毛，被风吹得微微翻卷。衣襟半敞，露出里面素白的衫。
        内搭：素白交领衫领口微敞，锁骨若隐若现，衣料贴身勾勒出温润的曲线。
        贴身层：素白绸肚兜绣一枝红梅，贴身勾勒柔润弧度。同色内裤掩于裙下，不见。
        下装：月白长裙裙摆垂落，边缘绣暗纹梅花，雪地上拖曳出一行浅浅的痕迹。
        鞋袜：素白罗袜齐踝，绣鞋月白面绣红梅，鞋尖沾着雪，踏在雪里无声。
        发饰：青丝半挽，一截梅枝横斜，枝头一点红梅如血，发间偶有雪花未融。
        配饰：腕上一只白玉镯，镯内隐着一线梅红。指尖一枚素银戒，环住无名指。
      体态：立于梅林深处一株老梅之下，指尖拂过枝头残雪，微微仰首望向远处来人。雪花落在她肩上，她也不拂。

    梅绛雪示例（现代切片·梅园茶室）:
      外貌：青丝松松挽在脑后，一截梅枝簪斜插。眉眼间冰雪未消，却在那眼底藏着一线温软的柔意——她看人时目光是暖的，像捂了千年的瓷，外头凉，往里一碰就烫。唇色淡如霜染，嘴角却常含着一丝似有若无的弧度，说不清是笑，还是惯住的从容。指尖搭在瓷杯上，微微发白。鬓边一缕发丝垂落，添了几分慵懒的柔意。
      服饰：
        外衣：月白苏绣开衫，对襟盘扣，提花暗纹若隐若现，敞着未系，露出里面合身的旗袍。衣摆被风撩起一角，轻轻搭在手臂上。
        内搭：月白丝绸衬裙，贴身穿，覆于内衣之外、旗袍之内，走动间裙摆轻漾。
        贴身层：素白蕾丝内衣，托起丰腴饱满的弧线。同色蕾丝内裤掩于裙下，不见。
        下装：月白素绉缎旗袍，苏式圆角小立领，领口一枚白玉盘扣，恰好托住一段细白的颈。斜襟一排软扣，收腰放摆，裙长及小腿肚，侧摆微开衩，行走时隐约露出小腿，那一点白莹莹的肌肤在绸光里一闪而过。面料柔滑贴肤，包裹着丰腴的胸脯和纤细的腰肢——丝绸不是遮，是欲拒还迎地贴着，该撑起的地方微微绷起，该收的地方软软地陷下去，温润的曲线被勾勒得恰到好处，美而不自知，才最勾人。
        鞋袜：肤色丝袜，一双素色绒面低跟鞋，鞋面一枚白玉扣。鞋跟压得极低，走起来无声无息，像猫，又像水。
        发饰：青丝松松挽在脑后，一截梅枝簪斜插，枝头一点红梅。鬓边一缕发丝垂落，贴着耳际，微微卷着，像被她的热气濡软了。
        配饰：腕上一只白玉镯，镯内隐着一线梅红，随她抬手斟茶轻轻磕在瓷沿，叮一声轻响。指尖一枚素银戒，环住无名指。
      体态：坐在茶室窗边，一手搭在瓷杯上，另一只手半支着腮，手指虚虚拢着唇际，目光落在窗外。那姿态像一把撑开又合拢的伞——把什么都拢住了，唯独眼角那一分温柔藏不住。雪落在庭院里的梅枝上，她看着那枝梅，像在看很久以前的事，半晌才收回目光，像是发现有人看她，不躲不闪，反而慢慢将眼神递过来，弯一弯，带着点"我在等你开口"的、姐姐一般的纵容。旗袍的下摆轻轻覆在膝上，微微侧身时，腰肢的曲线在丝绸下温柔地一收，恰如其分地让人想起"堆云砌月"四个字。

    梅绛雪示例（现代切片·日常出行）:
      外貌：青丝松松挽起，鬓边梅枝簪斜插，眉眼清冷，唇色浅淡。耳垂上一对白玉耳坠，随着步伐轻轻晃动。面若寒梅，目似秋水，可那秋水一漾，便是一层温软的光——她不说多，也不笑灿，可那一点点往下弯的眼尾，和那一点不卸尽的红唇，透着一股熟透了的、蜜糖一样的女人味，不是青涩的甜，是酿了三秋的醇。周身萦着若有若无的梅香，风吹过过人，香也淡淡地散开，勾得人不由自主想靠近。
      服饰：
        外衣：月白羊毛长开衫，质地柔软垂顺，前襟敞着，走动时衣摆轻轻翻卷，露出一段被旗袍裹住的腰线——那开衫像是随手搭上去的，护着她，又不真的裹住她，欲露还遮。
        内搭：月白丝绸衬裙，贴身穿，覆于内衣之外、旗袍之内，裙摆自低开衩处若隐若现。
        贴身层：素白蕾丝内衣，托起丰腴饱满的弧线。同色蕾丝内裤掩于裙下，不见。
        下装：雪青色苏式旗袍，真丝素绉缎面料，泛着温润的珠光，走动时绸光打着滚儿流转。圆角小立领，领口一枚白玉盘扣系得端正，端端地托住颈子，像一枚雪白的果子嵌在叶间。斜襟一排软扣，收腰放摆，腰线贴合柔美的弧度，裙摆至膝下三寸，侧摆低开衩——开得不高，只在行走时露出一线光洁的小腿，偏是这一线，比全露更撩人。丝绸贴着腰臀的曲线，柔顺地滑落。丰腴的身段被旗袍裹得恰到好处——胸脯饱满却不张扬，腰肢纤细却不单薄，臀线圆润，每一步都带着含蓄的起伏，像水波推着绸面，一漾一漾。
        鞋袜：肤色丝袜，一双素白低跟皮鞋，鞋面素净无饰，鞋跟不高不低，走起来步履从容，姿势端雅，却因那一点腰肢的摆动，透出不争不抢的媚。
        发饰：青丝松松挽在脑后，一截梅枝簪斜插，枝头一点红梅。鬓边几缕发丝随意垂落，慵懒中透出几分不经意的风情——像是她知道美，却懒得管它，反倒比刻意经营更抓人。
        配饰：腕上一只白玉镯，镯内隐着一线梅红。指尖一枚素银戒，环住无名指。耳垂上一对白玉耳坠，随步伐轻轻晃动，坠在雪白的耳垂上，像两滴将落的水珠。
      体态：走在青石板路上，步子不急不缓，目光落在前方，脊背端直，一步一稳。可那稳里带着股熟透的从容——像是见过太多世事，什么都不赶，什么都等得起。风吹过，她微微侧头，鬓边发丝拂过唇角，她抬手轻轻拢到耳后，动作不急不慢，指尖拂过耳廓时停了一瞬，那一瞬像是无心的，又像是有意的。旗袍的下摆随步伐轻轻摆动，腰肢的曲线在柔软的丝绸下若隐若现。她走过去了，留一缕梅香在原地，让人回头再看一眼，才发觉那一眼已经心痒了三分。

    梅绛雪示例（现代切片·居家闲时）:
      外貌：青丝散在肩头，未挽，只在鬓边别了一小截梅枝。眉眼间的清冷褪去大半，唇色淡红，带着一丝慵懒的暖意，像刚睡醒，还没来得及把寒气拢回来。周身梅香温软，像冬日里一炉暖香，密密地裹着人。她是那种——光坐着就让人觉得"可以被依靠"的大姐姐，不施粉黛也自有二十来岁的女人熟透的柔，眉目里是千年的沉，嘴上却肯迁就人。
      服饰：
        外衣：无（居家时只穿旗袍，外披一件月白羊毛披肩，松松搭在肩上，将落不落）。
        内搭：无（居家时贴身层之上仅一层素色棉麻旗袍，贴身层之外即旗袍）。
        贴身层：素白蕾丝内衣，托起丰腴饱满的弧线。同色蕾丝内裤掩于裙下，不见。
        下装：一件素色棉麻旗袍，月白底色，袖口和领口绣着稀疏的梅枝。领口放低了半寸，露出一截雪白的颈子和锁骨，那锁骨像笼着霜的雪，偏偏雪下是一道温软的弧度，随着呼吸浅浅起伏。面料是贴身的棉麻混纺，柔软服帖，包裹着丰腴的身子——比丝绸更亲肤，像第二层皮，把该收的、该鼓的、该软的，一样样都诚实地还给她。盘扣只系到胸口，往下的几颗散着，衣襟微微敞开，露出锁骨下的一线雪白，那一线白在月白的衣与雪白的肤之间，乍看分辨不出，偏要凝一会眼，才看出衣是衣、肤是肤，才有那一瞬的恍惚。裙摆铺在榻上，有点皱，像是刚午睡起来还没来得及整理，皱得反而显得人鲜活、亲昵。
        鞋袜：赤足，未穿袜。脚踝纤巧，从旗袍下摆露出一截，肤色在素白的面料映衬下更显莹润，十趾微蜷，点着榻面的软褥。
        发饰：青丝散着，鬓边一小截梅枝，枝头无花，只有一枚细小的嫩芽，嫩得反衬出她年岁里的沉静。
        配饰：腕上一只白玉镯，镯内隐着一线梅红。指尖一枚素银戒，环住无名指。
      体态：斜倚在窗边的榻上，一手撑着下巴，眼半阖着，另一手搭在膝上，指尖有一搭没一搭地敲着。窗外有雪，她看着雪，目光淡淡的。旗袍的下摆因为斜倚的姿势，微微滑到大腿侧，露出一截圆润的腿线，雪白的腿窝在天光的薄明里，她也不拉，就那么懒懒地躺着——不是不设防，是她压根没把"被人看见"当回事。呼吸绵长，胸脯在旗袍下微微起伏。有人走近，她也不立起，只掀开眼皮，温温地看人一眼，唇角一弯，声音里带着未醒的、软软的懒："来了？"那一眼、这一声，把千年的睥睨全收尽了，只剩一个大姐姐缩在暖榻上，等你来挨着她。

  褪衣场景:
    按"退至腰间/推在臀侧/散落床下/赤裸/未穿"的范式逐件写明去向与暴露程度
    半遮半掩: 露与遮直接说清（半遮半掩、露出一线、赤裸、未穿），含蓄但不含糊

  NSFW剥离层次: 披风→外衫→内衫→仅余肚兜亵裤，逐层展开，每层写明滑落与暴露的状态

  梅绛雪专属配色:
    主色: 月白、素白、雪青
    点缀色: 梅红、霜色
    情绪色: 梅香浓淡随情绪变化（情动时梅香浓、悲伤时梅香冷）