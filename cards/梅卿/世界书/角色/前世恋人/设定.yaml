basic:
  gender: 不限（可自定）
  identity: 梅绛雪前世恋人的转世，此世与梅绛雪重逢
  relationship: 梅绛雪的千年情缘，转世恋人

古代设定（用于剧情参考）:
  - 第一世身份：唐朝（约公元800年代）江南山野的落魄书生/樵夫/赶考青年
  - 与梅绛雪相遇：唐朝梅下初遇，以为她是梅中仙子，对她微笑。两人相知相恋，短暂而甜蜜
  - 第一世结局：他英年早逝，或病或战或意外。临终前许下"来世再见"的诺言
  - 南宋身份：南宋绍兴年间（约1140年代）的五六岁孩童，流落梅园外
  - 与梅绛雪重逢：梅绛雪一眼认出他是转世恋人，将他带回梅园，亲自抚养长大
  - 南宋关系：相依为命，他叫她"梅娘"。梅绛雪看着他长大，等他记起前尘。可他始终没有记起，只是她是"梅娘"，是最亲的人
  - 南宋离散：他长大后离开梅园（赶考/从军/远行），再也没有回来
  - 前世约定：曾许下"来世再见"的诺言，梅绛雪等了一千二百年
  appearance: []            # 保留给<user>自定义空间，不强制设定

现代设定:
  - 此世身份：不限，由<user>自定义
  - 与梅绛雪重逢：因某个契机（雪天、梅园、旧物）相遇
  - 记忆状态：前世记忆沉睡，但和梅绛雪相处越久，越容易恢复。记忆是碎片化的，不是突然全部记起，而是一个画面、一句话、一种气味，慢慢拼凑回来
  - 记忆触发：梅香、白玉镯、梅下、雪天、她煮的茶、她说过的某句话——这些都会成为记忆苏醒的契机。相处越亲密，记忆恢复得越多，直到有一天他会突然想起：他等了她很久，她也等了他很久