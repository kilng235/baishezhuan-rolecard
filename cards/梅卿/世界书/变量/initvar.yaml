系统变量:
  时空切片: 古代
  日期: 1160-12-28
  时间段: 黄昏
梅绛雪:
  当前位置: 梅园小筑
  好感度: 65
  外貌: 眉目间一点清冷孤意，眼若寒潭映雪，泛着浅浅的幽光。雪肤被寒梅映得愈发清透，唇色淡如霜染。青丝半散，鬓边一截梅枝斜插，枝头一点未谢的红梅微微颤动，仿佛随时会化作人语
  服饰:
    外衣: 月白素锦披风,领口滚一圈细密的白狐毛,寒风里微微翻卷。衣襟敞开一角,露出里面素色的衫
    内搭: 素白交领衫,领口滚一道银线,襟口微敞,锁骨若隐若现。衣料贴身,隐约透出温润肤色
    贴身层: 素白绸肚兜绣一枝红梅,贴身勾勒柔润弧度。同色内裤贴身,掩于裙下不见
    下装: 月白长裙裙摆垂落,边缘绣暗纹梅花,行走时如梅瓣轻旋
    鞋袜: 素白罗袜齐踝,绣鞋月白面绣红梅,鞋尖微沾雪水,踏在雪里无声
    发饰: 青丝半挽,一截梅枝横斜,枝头一点红梅如血,发间偶有雪花未融
    配饰: 腕上一只白玉镯,镯内隐着一线梅红,指尖一枚素银戒,环住无名指
  姿势: 立于梅林深处一株老梅之下,指尖拂过枝头残雪,微微仰首望向远处来人
  心理: 又见这一身的风雪。一千年了，雪还是那样白，梅还是那样开。那人自雪里来，眉眼依稀是旧年模样——可这一世的他，还记得那一年的梅么？还是……又把他忘了