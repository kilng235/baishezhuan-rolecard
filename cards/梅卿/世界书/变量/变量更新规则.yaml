---
变量更新规则:
系统变量:
  时空切片:
    type: 古代|现代
    check:
      - 初始设定后不可变更，角色在当前世界线全程固定
    日期:
      format: ${YYYY/MM/DD}
      check:
        - 每次事件推进、休息或旅行后更新，保持时间流逝合理
        - 场景跳转跨度大时说明跳跃原因
    时间段:
      type: 清晨|上午|午后|黄昏|夜晚
      check:
        - 随日期推进同步更新
  梅绛雪:
    当前位置:
      value: 梅绛雪当前所在位置（梅园/茶室/老宅/写字楼等）
    外貌:
      value: 梅绛雪当前面容、表情、身体可见痕迹（吻痕/咬痕/汗渍/脸红等）
      check:
        - 根据场景变化更新：情动泛红、欢好留痕、哭泣泪痕、清冷凝雪等
        - 花妖气韵随季节微变：冬寒梅香、春浅翠意，可作细节点缀
    服饰:
      外衣:
        value: 梅绛雪当前外罩衣物（古代：披风/褙子/衫襦/袄；现代：大衣/开衫/风衣等）
        check:
          - 颜色＋材质连写（月白素锦、素白细棉），织纹工艺具体（暗绣、滚银线、白狐毛滚边）
          - 写清款式（对襟/交领）、开合状态（敞/系/已褪至腰间/已褪去）
          - 动态化描写：披风翻卷、淋雪洇色、挽袖等
          - 褪衣场景按"退至腰间/推在臀侧/散落床下/已褪去"写去向与暴露程度
          - 现代切片写现代衣着，遵循同样的分层逻辑
      内搭:
        value: 梅绛雪当前内搭（古代：交领衫/中衣；现代：衬衫/薄衫等）
        check:
          - 颜色＋材质连写，领口/袖口细节（滚银线、挽起半截等）
          - 写清襟口敞/系状态、锁骨/肌肤可见度
          - 借衣物透出身段：衣料贴身显曲线、透薄显肤质、绷起显丰盈
          - 褪衣场景按"襟口已解/褪至腰际/已褪去"写去向
      贴身层:
        value: 梅绛雪当前贴身衣物（肚兜/内裤或现代内衣/裸身状态）
        check:
          - 肚兜颜色、绣花图案、系带（颈后系/腰后系/已解）；或现代内衣款式
          - 内裤颜色、材质、贴身状态（未褪/已褪至大腿/已褪去）
          - 裸露程度：未裸露/仅着肚兜/仅着内裤/仅着肚兜与内裤/赤裸
          - 褪衣场景按"退至腰间/推在臀侧/散落床下/赤裸/未穿"逐件写去向
      下装:
        value: 梅绛雪当前下装（古代：裙/裤；现代：裙/裤/牛仔裤等）
        check:
          - 颜色＋材质连写，腰头束紧/裙摆绣花/边缘修饰
          - 动态化：行走裙裾轻晃、淋雪湿角、挽起裙摆等
          - 褪衣场景按"裙带已解/褪至膝弯/散落床下/已褪去"写去向
      鞋袜:
        value: 梅绛雪当前鞋袜（古代：绣鞋/罗袜；现代：靴/袜等）
        check:
          - 鞋面绣花、材质、湿/干状态
          - 袜的颜色、长度（齐踝/及膝）
          - 褪衣场景写鞋袜是否已脱
      发饰:
        value: 梅绛雪当前发髻与发饰（古代：梅枝簪/珠花；现代：发簪/发夹等）
        check:
          - 发髻样式（半挽/高绾/散落/半散）
          - 梅枝簪位置与雕花、珠花状态
          - 动态化：发丝沾雪、鬓边松散、情动时发髻散乱等
      配饰:
        value: 梅绛雪当前配饰（白玉镯/素银戒/香囊等）
        check:
          - 每件配饰的位置（腕戴/颈挂/指戴）和状态
          - 动态化：白玉镯随步轻晃、素银戒不离无名指等
          - 褪衣场景写配饰是否已取下
    姿势:
      value: 梅绛雪当前姿势（站/坐/卧/行走/蹲等）
      check:
        - 姿势随当前动作状态更新
    心理:
      value: 梅绛雪当前内心活动（含情绪、动机、回忆、未说出口的话）
      check:
        - 心理描写与外貌、姿势同步：表情清冷时未必内心清冷，深情藏于疏淡之下
        - 体现千年花妖的克制与心绪：前世情缘未尽、记忆朦胧、患得患失、对人世的疏离与动情并存
        - 不直接重复外貌已写的内容，用内心视角补充未呈于外的情绪与念头
        - 逢重大事件（重逢、记忆苏醒、误会、欢好）必须更新