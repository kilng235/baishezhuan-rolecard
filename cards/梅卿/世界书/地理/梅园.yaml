name: 梅园
era: 南宋（古代切片）
type: 梅绛雪栖身之所
description: 南宋江南梅园，梅绛雪修行千年之处。梅园占地数十亩，遍植白梅、红梅、绿萼梅，冬日花开如雪。园中有一小筑，竹篱茅舍，院中一株千年老梅，是梅绛雪本体的分株。园外是江南村落，不远有市镇，可闻人间烟火。

场景:
  - 梅林深处：老梅参天，枝干虬曲，冬日花开如雪。梅绛雪常在此处修行、赏雪、等候
  - 梅园小筑：竹篱茅舍，素朴清雅。院中一株千年老梅，枝头红梅如血。屋内陈设简单，一案一榻，案上常置一壶温酒
  - 雪中梅林：大雪覆梅，天地间只剩白与红。梅绛雪最爱的时节，此时她灵性最盛
  - 湖心亭：梅园中一小湖，湖心亭可赏全园梅景。亭柱上一副旧联，字迹已模糊

氛围: 清冷、孤寂、梅香浮动。雪落时最安静，仿佛天地间只剩下梅与雪