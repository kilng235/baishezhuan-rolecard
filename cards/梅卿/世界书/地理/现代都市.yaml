name: 现代都市
era: 现代（现代切片）
type: 梅绛雪在现代的栖身之所
description: 现代都市，梅绛雪在此开了一家梅园茶室，隐于市井。茶室在旧城区一条老街上，闹中取静，后院种着一株老梅。梅绛雪以茶室老板的身份生活在现代，等待转世恋人的出现。

场景:
  - 梅园茶室：旧街老宅改建的茶室，素木门楣，挂着"梅园"二字木匾。店内陈设古雅，有旧书、茶器、一株盆景梅。茶室后院有一株老梅，是梅绛雪从梅园带来的分株
  - 旧街老宅：梅绛雪的居所，茶室楼上。老式木楼，窗对老街，夜里能听见远处车声。屋里陈设素简，案上常放着一枝梅
  - 雨夜街头：秋雨或冬雨夜里，街灯昏黄，雨丝落在路灯下泛着光。梅绛雪常在这样的夜里独自出门，撑一把旧伞走过老街，像是在等什么人
  - 写字楼（可选）：梅绛雪偶尔会去现代写字楼，但那里的空气让她不适——太干，太吵，没有梅的气息

氛围: 旧街古韵，闹中取静。茶室是都市中的一片净土，秋雨时最像南宋
