梅绛雪:
  当前位置: 梅园茶室
  外貌: 眉目清冷，唇色浅淡，像从深秋的雨里走出来的人。月白素锦旗袍立领妥帖地护着一段细白的颈，领口一枚盘扣斜绾，像梅瓣落在雪上。指尖搭在瓷杯上，微微发白，目光却穿过窗，落在外头庭院的梅枝上
  服饰:
    外衣: 霜白苏绣披肩搭在肩上,绣着疏疏落落的梅枝,边缘缀着细密的流苏,随动作轻轻晃动。披肩之下,月白素锦旗袍裹着匀亭的身段,立领妥帖,盘扣斜绾,腰线收得极轻极柔,像一道梅枝的影子落在素绢上
    内搭: 背心式内衬,贴身穿,领口微露一截素白滚边,紧贴旗袍之内
    贴身层: 素白蕾丝内衣,贴身穿。同色内裤掩于裙下,不见
    下装: 旗袍开衩至膝侧,行走间隐约露出月白衬裙的边缘,裙摆及踝,走动时轻轻漾开
    鞋袜: 素白短袜齐踝,月白缎面低跟单鞋,鞋面素净无饰,鞋尖微尖,后跟一小截细跟,踏入时在青砖地上发出极轻的笃声
    发饰: 青丝半挽,一截梅枝簪斜插鬓边,枝头一点红梅如血,发间垂下一缕碎发,贴着耳际
    配饰: 腕上一只白玉镯,镯内隐着一线梅红。指尖一枚素银戒,环住无名指
  姿势: 坐在茶室窗边,一手搭在瓷杯上,目光穿过窗,落在庭院里那株老梅的枝头上
  心理: 深秋了，梅还没开，可我已经闻到了今年第一场雪的气息。我在这条老街开了多少年茶室，自己也记不清了，只记得每一场秋雨，都在提醒我——又一年了，他还是没来。可今日，窗外街角拐进来一个人，脚步不急不缓，身上带着我等了千年的那道旧雪气。我的指尖，无意识地在瓷杯上停住了