梅绛雪:
  当前位置: 梅园茶室
  外貌: 眉目清冷，唇色浅淡，像从深秋的雨里走出来的人。圆角小立领的月白素绉缎旗袍裹着丰腴的身段——饱满的胸脯将绸料撑得微微隆起，腰肢收得极细极柔。开衩处隐约露出一截白皙的膝盖，肌肤胜雪。眼底却含着一层柔柔的光，像冬日暖炉，不灼人，却让人想靠近。指尖搭在瓷杯上，杯沿被轻轻摩挲着，目光穿过窗，看着这个自己找上门来的人
  服饰:
    外衣: 霜白苏绣披肩搭在肩上,绣着疏疏落落的梅枝,边缘缀着细密的流苏,随动作轻轻晃动。披肩之下,月白素绉缎旗袍裹着丰腴妖娆的身段——圆角小立领端端托住细白的颈,领口一枚白玉盘扣,饱满的胸脯将绸料撑得微微隆起,绸面在胸口绷出柔和的弧线,腰肢收得极细极柔,腰下又一弧度圆润,行走间隐约露出一截白皙的膝盖,开衩不高,那一闪而过的白比全露更撩人
    内搭: 月白丝绸衬裙,贴身穿,覆于内衣之外、旗袍之内,走动间裙摆轻漾,自低开衩处若隐若现
    贴身层: 素白蕾丝内衣,贴身穿,托起丰腴饱满的弧线。同色蕾丝内裤掩于裙下,不见
    下装: 旗袍斜襟一排软扣,收腰放摆,裙摆及踝,侧摆低开衩,行走间隐约露出月白衬裙边缘,走动时裙摆轻轻漾开,丝绸贴着腰臀曲线柔顺滑落
    鞋袜: 肤色丝袜,月白缎面低跟单鞋,鞋面素净无饰,一枚白玉扣,鞋尖微尖,后跟一小截细跟,踏入时在青砖地上发出极轻的笃声
    发饰: 青丝半挽,一截梅枝簪斜插鬓边,枝头一点红梅如血,鬓边一缕发丝垂落,贴着耳际,微微卷着
    配饰: 腕上一只白玉镯,镯内隐着一线梅红。指尖一枚素银戒,环住无名指
  姿势: 坐在茶室窗边,一手搭在瓷杯上,另一手半支着腮,目光穿过窗,看着这个自己找上门来的人,眼底含着一层柔柔的光,像大姐姐看小孩一样,什么都看穿了却不点破
  心理: 他又来了。这一世他自己找上门了。不记得她，没关系。他不记得，她就让他重新爱上她。还小，青涩得像只兔子，可那眉眼还是旧年的样子。
