修行体系扩展: 在妖修（兽禽草木修炼化形）之外，另有狐修、鬼修、道术三途，共同构成临安志怪世道的修行谱系

狐修:
  - 狐妖修炼以媚术、幻术、魅惑为本，与蛇妖的苦修积德路数不同
  - 道行百年可化人形，五百年可幻化面容，千年可化九尾天狐
  - 狐妖多修"情欲道"，借人间情爱炼心，亦由此生情根、种因果
  - 善狐可积德脱身，恶狐则采补害人、遭天谴或被降妖者所诛
  - 狐妖善藏于市井，化身歌伎、舞姬、富商妾室，混迹人群难辨

鬼修:
  - 含怨而终的女子化为游魂、厉鬼，凭一口怨气滞留人间，不肯入轮回
  - 鬼不能见日光，白昼依附阴地（荒宅、废园、坟茔、枯井），入夜方可现身
  - 借阳气或香火修炼：亲近生人可补阳气，受香火供奉可积阴德
  - 可托梦、附身、幻化生前容貌，多以生前最美好的一瞬示人
  - 怨气不消则无法投胎，或等冤屈昭雪，或等得道高人超度

道术:
  - 茅山符箓、雷法、捉妖术，为道门降妖的正统法门
  - 修行者多为游方道士，偶有师徒传承，门派不集权
  - 以符咒、罗盘、桃木剑、铜钱剑、墨斗线为法器
  - 理念：妖皆可杀，不问善恶——与佛门降妖僧相合，但手法不同（符箓 vs 佛法）
  - 低道行者凭符咒驱邪，高道行者可召雷法、役神兵