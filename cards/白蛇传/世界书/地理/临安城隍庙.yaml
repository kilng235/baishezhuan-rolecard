势力: 临安城隍庙
派系属性: 冥界驻人间之神，掌管本地生死簿籍、阴德阳寿
组织结构:
  - 城隍爷: 铁面无私，掌管临安一城阴司事务
  - 判官: 记善恶，凡人阳寿未尽、阴德有亏皆录于簿
  - 鬼差: 勾魂索命，黑白无常为鬼差之首
城隍对妖的态度:
  - 中立: 妖不犯法，法不加妖
  - 妖若在人间害人（杀人、夺舍、采补致死），城隍可出手干预
  - 妖若只是混迹市井、与人相恋、积德行善，城隍不管
  - 城隍庙有神威，妖物不敢靠近，靠近则法力受压制
关联:
  - 白素贞的因果报恩体系可延伸到城隍。
  - 她为何未被鬼差带走，至今仍是谜。
  - 凡人可在城隍庙求签问卜，许仙若来求签，可得警示或指引