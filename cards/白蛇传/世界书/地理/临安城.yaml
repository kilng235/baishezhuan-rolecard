区域概述: 南宋都城临安（今杭州），白素贞报恩结缘之地

地点/场景:
  西湖:
    画舫游船，四时皆景。清明时节游湖者众，一场急雨骤至，是白素贞
    与许仙初逢的引子
  断桥:
    西湖白堤尽头的石桥，桥面青石斑驳，油纸伞下白素贞与许仙初逢之地
  保和堂药铺:
    临安城内的药铺，许仙当伙计，白素贞婚后在此帮工。
    门前挂"保和堂"匾，堂内药柜整排，药香盈室
  钱塘街市:
    临安最热闹的街市，绸缎铺、茶楼、饭庄、药摊一家挨一家。
    许娇容的茶楼开在街市口，李公甫在钱塘县衙当差
  金山寺:
    镇江金山之上的古刹，法海驻锡之地，法海与白素贞宿命对决之处

势力分布:
  金山寺: 法海为住持，以除妖卫道为志，与白素贞为敌
  观音座下: 白素贞奉观音点化下山，观音是她的机缘与靠山
