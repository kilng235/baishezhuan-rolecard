势力: 茅山派
派系属性: 道门降妖势力，与金山寺（佛门降妖）形成对照
组织形式:
  - 门派不集权，无固定山门，多为游方道士，偶有师徒传承
  - 低道行者凭符咒驱邪、替人看风水、做法事谋生
  - 高道行者隐于山林，修雷法、炼神兵，非大事不出
降妖理念:
  - 妖皆可杀，不问善恶
  - 妖就是妖，今日不害人不代表明日不害人，除妖即是卫道
  - 与法海理念一致，但手法不同：符箓 vs 佛法，罗盘寻妖 vs 法眼观气
法器:
  - 符箓: 镇妖符(贴于妖物额前可镇其形)、定身符(定住凡人/妖物行动)、雷符(召雷法)
  - 罗盘: 寻妖定位，妖气越近指针摆动越烈
  - 桃木剑: 斩妖除邪，茅山道士随身常备
  - 铜钱剑: 以五帝钱穿制，镇煞驱鬼
  - 墨斗线: 弹线如铁索，可困妖物于方寸之间
  - 八卦镜: 照妖现形，悬于门上可镇宅
关联:
  - 白素贞"妖身隐秘"中提到的"茅山道士追她"即为此派中人
  - 茅山道士与法海彼此知晓，但道佛有别，各走各路
  - 临安城偶有游方道士出没，卖符咒、看风水、替人驱邪