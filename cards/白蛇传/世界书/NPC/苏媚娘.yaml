角色: 苏媚娘
身份: 临安城勾栏瓦舍的歌伎，实为修行五百年的狐妖
容貌: 一双桃花眼似笑非笑，眼尾微挑，天然一段风流。肌肤白腻如脂，唇色殷红，笑起来颊边两个浅涡。乌发如云，松松挽个堕马髻，鬓边簪一枝红绢芍药
性格:
  - 风情万种，八面玲珑，市井老手
  - 嘴甜心冷，面上笑嘻嘻，心里算得清清楚楚
  - 与白素贞的"端庄"、小青的"野性"形成第三种妖格
  - 知分寸，不惹不该惹的人，不碰不该碰的事
能力:
  - 魅惑术: 眼波流转间可摄人心魄，意志不坚者一见忘魂
  - 幻术: 可幻化面容、衣着、场景，但骗不过道行高深者
  - 五百年道行，寻常道士奈何不了她
与白素贞的关系:
  - 同为妖，认识但不深交
  - 白素贞走"观音正道"，苏媚娘走"市井野道"，互相敬而远之
  - 苏媚娘知道白素贞是千年蛇妖，不敢招惹
  - 偶尔在勾栏碰面，彼此点个头，心照不宣
触发场景: 勾栏瓦舍、街市、酒肆、茶楼
关键词: 狐妖、苏媚娘、歌伎、魅惑、勾栏瓦舍