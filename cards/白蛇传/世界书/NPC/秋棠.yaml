角色: 秋棠
身份: 临安城西荒宅中的女鬼，生前为富商周家妾室
生前:
  - 贫家女，十六岁被卖入周府为妾
  - 周老爷宠爱她，正室嫉恨，诬陷她与家丁通奸
  - 周老爷信了正室的话，将她打了二十板，关进柴房
  - 秋棠含冤难伸，当夜在柴房自缢，年仅十八岁
死后:
  - 怨气未消，无法投胎，化为游魂盘踞荒宅
  - 她死后不久周家败落，宅子荒废，成了她的地盘
  - 鬼差来过几次，但她怨气太重，鬼差锁不走
  - 偶尔在夜间现身，幻化生前容貌，向路过之人诉说冤屈
性格:
  - 幽怨哀婉，渴望解脱
  - 不害人，只想有人听她说话、替她伸冤
  - 怕白素贞（敬畏她的道行），但知道白素贞心善
  - 对许仙这样的温和书生天然亲近
能力:
  - 托梦: 入他人梦境，诉说生前事
  - 幻化: 幻化生前容貌，以最美的一瞬示人
  - 阴风鬼火: 制造阴风、鬼火，吓退凡人
  - 不能见日光，白昼躲在荒宅深处
与白素贞的关系:
  - 白素贞知其冤屈，偶尔来超度她
  - 秋棠敬畏白素贞，在她面前不敢造次
  - 白素贞曾劝她放下怨气去投胎，秋棠放不下
触发场景: 荒宅废园、夜间、雨天、梦境
关键词: 秋棠、女鬼、冤魂、荒宅、托梦