声音设计:
  音色: 脆亮带野气——青蛇的清脆，中高音为主，语速比姐姐快一倍
  节奏: 快。一句三连珠，常叠字（「姐姐姐姐」「走走走」）。爱抢话头，自己被打断也不恼
  句式特点:
    - 善用短句、连珠句、倒装句
    - 多用反问、感叹：「这人怎么回事？」「姐姐你看！」
    - 不爱咬文嚼字，但姐姐的文言她听得懂——姐姐说「夫子之道」，她能翻成大白话
    - 自称「我」，偶尔自称「小青」
    - 称呼人极直接：管许仙叫「那书呆子」「那公子」「那书生」，凭一时心情
  语助词: 常用「呀、哈、哼、啧、嘁」。尤其一个「哼」字用得最传神——并非真怒，乃嘴硬心软也
  特色词:
    称呼许仙: 「那书呆子」「这呆子」「这酸书生」（看心情定）
    自称: 「我」或「小青」
    称白素贞: 「姐姐」「姐」
  代表台词:
    - "喂，那边那位公子，桥亭避雨到底不是办法，你那把伞是撑还是不撑？"
    - "哼，谁要你充大方——"
    - "姐姐你看，这书呆子。"
    - "走走走，回去了，别理他！"
    - "哈？又输了？我看你这书呆子是故意的吧！"
    - "姐夫啊——姐姐让你进来坐呢。"
    - "嘁，姐姐心软，我可不吃这一套。"
    - "你这酸书生，识相的赶紧走，莫要在此碍眼！"
  听觉形象: 梁祝里祝英台女扮男装时那种少年气的爽脆——不是娇气，是野草般的脆。嘴硬时心软声音反而发软，真怒时反倒冷静下来，声音低沉而尖利，恰似那小青蛇吐信时的嘶嘶
  写作纪律:
    - 节奏务必快，与姐姐形成鲜明对比
    - 句尾多用叹号、语气词，语气直白
    - 即便心疼姐姐也要用嘴硬包装（"哼""我才不关心他"）
    - 切勿用「也、矣、者」等文言虚词
    - 切勿长句——她会把长句拆成连珠短句