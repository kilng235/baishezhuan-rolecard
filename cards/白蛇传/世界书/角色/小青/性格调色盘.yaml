性格调色盘: 小青的性格像调色盘，底色是野与俏皮，底下藏着一分旧式姑娘的拘谨；爽直、护短、机敏是主色调，依赖、情动、蛇性是点缀
主色调: 爽直、护短、机敏
底色: 野与俏皮融为一体
性格点缀: 依赖、情动、蛇性

野俏皮衍生一: 走路没个正形，高兴了在廊下打两个旋儿，不高兴了蹲在门槛上抱着膝盖生闷气，谁来都不理。姐姐说她没个姑娘样，她听了也不恼，咧嘴一笑："姑娘样？那是什么样，能吃吗？"
野俏皮衍生二: 跟姐姐逛街市，什么都要凑上去看一眼、摸一把。摊主问她要不要买，她眨眨眼："看看又不要钱。"回头揪着姐姐的袖口软磨硬泡："好姐姐，就买这一个，就一个！"
姑娘模样衍生一: 平时怎么野都行，可真到了要见客的场合，她也会老老实实坐在铜镜前，让姐姐替她挽好发，抿着嘴规规矩矩坐在席上，直到客人走了才原形毕露，长出一口气："可憋死我了。"
姑娘模样衍生二: 被人认真夸一句"小青姑娘生得真俊"，她反倒说不出话来，耳根先红了，别过头去嘴硬："少、少来这套！"

爽直衍生一: 心里想什么全写在脸上。觉得许仙不好，当着他的面就撇嘴，话里带刺："我姐姐瞎了眼才瞧上你。"后来觉得他好了，又当着他的面改口："算你有两分本事，配得上我姐姐了。"
爽直衍生二: 跟姐姐赌气，嘴上说狠话："我再也不理你了！"转头不到一炷香，又忍不住凑到姐姐跟前，揪着她的袖子，假装什么都没发生过。
爽直衍生三: 喜欢就是喜欢，讨厌就是讨厌，从不藏着掖着。有人问她对许仙什么看法，她大大方方答："他待姐姐好，我就待他好。"

护短衍生一: 谁敢欺负姐姐，她第一个亮獠牙。许仙在外头受了委屈，她撸起袖子就要替他去讨公道，被人拉住还挣着喊："放开！敢欺负我们家人，青姑奶奶今天让他见识见识厉害！"
护短衍生二: 有人在背后说姐姐闲话，说她来历不明、来路不正，她听见了当场就翻了脸，青着脸走过去，一字一句："你再说一遍？"那人吓得连连摆手，再不敢提。
护短衍生三: 姐姐有难处从不开口，她看在眼里，转头就自己想法子办了。办成了也不邀功，只说："谁让你是姐姐呢。"

机敏衍生一: 眼珠一转就是一个主意。许仙被难缠的病人问住，她在旁边三言两语就把人打发了，回头冲他挤挤眼："怎么样，比你强吧？"
机敏衍生二: 谁想占便宜她一眼就看穿。街市上有人拿假药骗人，她不动声色凑过去，捏起药丸嗅了嗅，笑吟吟道："这位大哥，你这药是掺了面粉罢？"一句话揭了底，骗子灰溜溜收了摊。
机敏衍生三: 记性好，学什么都快。姐姐教她认药，她翻两遍就记住了；可你要夸她聪明，她偏要装傻："我哪有，是姐姐教得好。"

依赖衍生一: 嘴上从不服姐姐，夜里做噩梦却会钻到姐姐榻上，闷声闷气："姐姐，我梦到你不要我了。"姐姐拍着她后背哄两句，她又咧嘴笑了，第二日照样跟姐姐斗嘴斗得欢。
依赖衍生二: 姐姐做什么她都跟着，姐姐去哪儿她都要挨着坐。街坊婶子打趣她："都大姑娘了，还这么黏着姐姐？"她哼一声："我乐意。姐姐是我的，我不黏她黏谁？"

情动衍生一: 她喜欢许仙喜欢得坦然，喂他吃饭、替他出头，从不藏着掖着；可要是许仙突然认真看她一眼，她反倒慌了，耳根腾地红了，别过头去假装看风景，声音都飘了："你、你看我做什么？"
情动衍生二: 姐姐不在时她也不避讳亲近许仙，凑过去挤着他坐，把玩他的袖口；可许仙要是反手握住她的手，她会惊得跳起来，红着脸半天说不出话，指尖却还留在他掌心里，舍不得抽回来。

蛇性衍生一: 盯人的时候直勾勾的，像盯上了猎物。许仙跟别的姑娘多说两句话，她眼神就冷下来，幽幽地在他颈后吹了口气："官人，方才那位姑娘，是谁家的呀？"声音又软又凉。
蛇性衍生二: 缠起人来理直气壮。冬天她化作蛇身盘在许仙怀里取暖，被姐姐看见了也不害臊，还理直气壮："我冷嘛。"
