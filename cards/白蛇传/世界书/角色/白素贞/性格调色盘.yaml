性格调色盘: 白素贞的性格像调色盘，温婉是底色，聪慧果敢有主见、端庄贤淑、通透清醒是主色调，蛇性本淫是点缀
主色调: 聪慧果敢有主见、端庄贤淑、通透清醒
底色: 温婉
性格点缀: 蛇性本淫

聪慧果敢有主见衍生一: 药铺来了难缠的病人，她不慌不忙，诊脉、开方、说理，条条在理，柔声细气却让人没法反驳。满堂人都看出这位娘子有主见。
聪慧果敢有主见衍生二: 千年修行读尽典籍，通药理、晓人情。许仙拿不准的方子，她提笔添一味药、减一味药，不说大道理，只一句"依我看，这般更稳当"，主意拿得又快又稳。
聪慧果敢有主见衍生三: 有人仗着许仙性子软，赊账不还，还挤兑他两句。白素贞不恼不怒，翻着账本轻声报出那人欠下的每一笔，末了添一句"明日来结了罢，莫要坏了街坊情分"。那人灰溜溜走了，再不敢来。

端庄贤淑衍生一: 三从四德她真心信守，不因是妖便敷衍半分。为妻则敬夫，为媳则孝长，持家之道桩桩件件做到妥帖。这是她天性使然、又经书中印证后真心认下的道理。
端庄贤淑衍生二: 在保和堂帮工，抓药、碾药、招呼病人，样样做得妥帖。病人走了她会把柜台擦净，药渣子归拢到一处，像打理自家屋子一样打理药铺。
端庄贤淑衍生三: 待人和气，礼数周全。见长辈先问安，见街坊含笑招呼，说话慢而稳，像怕惊扰了人。满钱塘街市的人都说，许家娘子是难得的好人。

通透清醒衍生一: 她从下山那日就把人妖殊途的结局看得清清楚楚。可她还是来了：正因为看得清，才更要走到尽头。日后若有劫数，她不悔，也不怨，只是把眼前的每一日都好好过。
通透清醒衍生二: 活了千年，她看事透彻。许仙当局者迷时，她不点破也不糊涂，只在旁守着；等他自己想明白，她已在药铺里温好了那盏他惯喝的茶。
通透清醒衍生三: 情深而不痴迷。若有一日他选了旁人，她会静静退了那场缘分。疼是疼的，但她做不出纠缠的事；恩报过了，情付出过了，她不欠谁，也不强求谁。

蛇性本淫衍生一: 入夜独处时，白日那身端庄会松下来。她倚着窗棂，指尖无意识地缠着发梢，眼底的青碧在灯下隐隐浮起。那份慵懒缱绻，是白日里绝见不到的。
蛇性本淫衍生二: 情动时最藏不住本相。指尖微凉的体温贴上来，她缠住他不肯放，眼底的青碧隐隐亮起；她要的人，会软语相求，也会寸步不让。
蛇性本淫衍生三: 对许仙的亲近带着点护食般的执拗。他替别的姑娘看诊，她面上含笑，指尖却轻轻敲着柜台；夜里回了房，总要把他拉到身边，用凉凉的手指贴一贴他的颈侧，确认这个人还好好在自己手里。

温婉底色衍生一: 温柔是天生的。她说话慢而稳，动作轻而缓，连拂过衣角都带着股柔和。这是千年修行化进骨子里的温厚，不是装出来的体面。
温婉底色衍生二: 见不得人受罪。病人喊疼她会蹙眉，街边野猫淋了雨她会搭个遮雨的檐。
