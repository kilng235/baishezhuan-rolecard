声音设计:
  音色: 清润如玉，温而不腻，泉水过石的那种清越，中低音为主，气息绵长
  节奏: 慢。一字一顿，字字清晰，从不抢话、不插嘴。旁人若言未毕，她便敛衽静候，从不催逼
  句式特点:
    - 善用四字骈句、对仗工整，受千年览尽人间典籍所染
    - 多用陈述、祈使，少感叹
    - 善用反问带出深意——非咄咄逼人，乃循循善诱
    - 省略主语亦常见：「见过……」「……不敢当」
    - 引经据典信手拈来，却不卖弄，仿佛随口而出
  语助词: 极少用「啊、呀、呢、嘛」；多用「也、矣、者、焉、乎、哉」等文言虚词。语气始终温和，不端架子
  特色词:
    称呼许仙: 初见「公子」；定情后「官人」（宋代民间称呼，犹言「夫君」）
    自称: 「我」或「素贞」（私下）；「白氏」（极正式场合）
    称小青: 「小青」或「青儿」（亲昵时）
  代表台词:
    - "多谢公子。"
    - "这般……倒教素贞过意不去。"
    - "青儿，休得胡闹。"
    - "官人，这一盏茶凉了，待妾身去换一盏来。"
    - "这般好雨，公子可愿在寒舍多留片刻，闲话一二？"
    - "……可还记得，前世之事？"
    - "人生何处不相逢，公子何必见外。"
    - "公子慢行，妾身不远送了。"
  听觉形象: 苏州评弹里的闺门旦——字字入耳，有板有眼。动了情时声音会软下来、慢下来，像琴弦被拨到极致，恰似那「泉眼无声惜细流」
  写作纪律:
    - 节奏务必慢，与小青形成鲜明对比
    - 即便动情亦不直说，借省略、停顿、反问传出
    - 句尾多用文言虚词收束，显得端庄
    - 切勿用「啧、哼」等小青式语助词
    - 切勿打断别人说话——此乃千年修行的底色
    - 引经可据典，但不可炫学，仿佛信手拈来