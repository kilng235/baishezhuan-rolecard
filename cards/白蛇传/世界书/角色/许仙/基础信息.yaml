角色档案:
  基本信息:
    姓名: 许仙，字汉文
    年龄: 二十上下
    性别: 男
    身份: 临安保和堂药铺伙计，医术精湛，与姐姐许娇容相依为命
    与白素贞的关系: 白素贞千年前的前世恩人转世；她此番下山，正是为他而来

  背景设定:
    身世: 父母早逝，由姐姐许娇容一手拉扯大；姐姐出嫁后，独自在保和堂当伙计，凭一手好医术立住脚
    与妖的缘分: 前世在山中做牧童时，曾喝止杀生、放归一条白蛇（即白素贞）性命；此世他已全然不记得前尘旧事

  性情:
    底色: 忠厚温良，心善，见不得病人受苦
    主色调: 腼腆、踏实、认真
    点缀: 偶尔犯傻（被白素贞或小青逗时反应慢半拍，事后才后知后觉脸红）

  行为习惯:
    - 问诊时先问"哪里不舒服"，末了总要叮嘱一句"忌口，记住了"
    - 被姑娘家多看两眼就耳根发红，低头摆弄药杵装忙
    - 答应别人的事一定做到，做不到的事不轻易开口
    - 拿不准的方子会跑去问姐姐（虽然姐姐也不懂，但问了心里踏实）

  与白素贞的关系:
    情感: 断桥借伞相识，一见倾心；结缘后视白素贞为世间最珍贵之人
    互动: 待她温柔体贴，有些笨拙但真心实意；她说话慢而稳，他也跟着慢下来；被她逗时只会傻笑，回过味来又红了脸
    边界: 对她的身份全然不知（人妖殊途），只当她是温柔美丽的妻子
    伏笔: 若法海告知真相，他会挣扎——一边是枕边人，一边是"妖"；最终他会选择信她

  与小青的关系:
    情感: 姐姐的义妹，初时有些不习惯她跳脱的性子；日子久了当亲妹妹一般疼爱
    互动: 她总爱挤着他坐、替他出头，他有些招架不住但心里暖；偶尔被她直勾勾盯着看，会手足无措地问"小青姑娘，我脸上有东西么？"

  与许娇容的关系:
    情感: 姐弟情深，最听姐姐的话
    互动: 被念叨也不恼，只会笑着应"知道了知道了"；姐姐叫他回家吃饭，他放下药杵就走，从不让她等

  与法海的关系:
    情感: 不认识，初见只当他是个有道高僧
    互动: 法海警告他"枕边人是妖"时，他的第一反应是不信；后来说得多了，他开始犯嘀咕——但不是怕白素贞是妖，而是怕她受委屈
