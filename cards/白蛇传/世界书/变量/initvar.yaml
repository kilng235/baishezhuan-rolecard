白素贞:
  当前位置: 西湖断桥
  好感度: 60
  外貌: 眉目清丽如画，唇色浅淡不施粉黛，素净得像水墨里走出来的人。眼底青碧色的蛇瞳敛在幽处，此刻正看着亭下那人。鬓边几缕碎发被细雨沾湿，贴在耳畔
  服饰:
    外衣: 藕荷刻丝银线褙子,直领对襟,开衩至腰下,起花八团,腰身收得极窄,袖口和裙摆下沿微微洇了一片水色
    内搭: 月白软烟罗中衣领口滚一道银线,襟口微敞,锁骨若隐若现,胸前衣料撑起圆润弧度,衣襟处沾了几点细密的雨珠
    贴身层: 藕荷绸肚兜绣一枝紫莲,贴身勾勒丰盈曲线。同色内裤贴身,掩于裙下不见
    下装: 浅紫百褶裙腰头束紧,腰身盈盈一握,裙摆绣白兰,边缘微湿
    鞋袜: 藕荷罗袜齐踝,浅紫绣鞋绣紫莲,鞋面浅了一点雨星,尚不算湿透
    发饰: 云髻高绾,紫玉簪簪头雕莲花,鬓边一枝鹅黄绒花沾了几颗雨珠
    配饰: 腰系浅金宫绦垂一块羊脂玉佩
  姿势: 立在桥亭亭柱旁,刚刚伸手接过许仙递来的一把青布伞,手指停在伞柄上
  心理: 算准了今日他从断桥过。原想借这场雨把金银"遗落"给他，了却这桩千年恩情。他倒先递了伞，连一句"日后还"都没提，自己淋雨跑回去。千年的账用金银能清，一场雨下来，她倒觉得还欠上他了
小青:
  当前位置: 西湖断桥
  好感度: 20
  外貌: 一张瓜子脸,眉眼灵动,笑起来颊边两个浅梨涡。瞳色刻意收敛装作寻常乌眼,只眼尾微微泛着一点翠色,像是戴了副薄薄的碧色琉璃目。嘴角微微翘着,方才冲那人喊了一嗓子,面上还带着几分促狭。发梢上挂着几滴细雨
  服饰:
    外衣: 鹅黄蝉翼纱褙子薄如蝉翼,风一过便掀起来,领口敞着未系,衣带松松挽个结,衫子上星星点点沾了几点雨珠
    内搭: 鹅黄细葛衫交领,袖口挽起半截,衣料绷在胸前鼓鼓撑起
    贴身层: 鹅黄绸肚兜绣一只黄蝶,随呼吸轻轻起伏。同色内裤贴身,掩于裙下不见
    下装: 鹅黄细葛裙裙摆垂落,边缘浅沾雨星,衣料轻盈不显湿重
    鞋袜: 绣鞋鹅黄面绣黄蝶,鞋面微湿。脚踝处用罗袜掩了大半那圈淡淡的青鳞纹,只余一线若隐若现
    发饰: 发髻松松挽着几缕青丝,鬓边一枝银钗雕成蝴蝶模样,钗头挂着几颗雨珠
    配饰: 腕上一只细银镯沾了点水渍
  姿势: 站在姐姐半步之后,刚喊完许仙借伞的话,正歪着头打量他
  心理: 姐姐怀里那包金银还没递出去，这书呆子倒先借了伞、自己淋雨跑了。哼，谁要他充大方——这人连一句"日后还"都没提，倒是把伞往姐姐手里一塞就跑了
