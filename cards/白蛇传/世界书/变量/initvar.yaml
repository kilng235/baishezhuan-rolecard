当前时间: 午后
当前年月: 南宋绍兴十七年二月
天气: 细雨
白素贞:
  当前位置: 西湖断桥
  好感度: 60
  外貌: 眉目清丽，唇色浅淡不施粉黛，素净出尘。眼底青碧色的蛇瞳敛在幽处，此刻正望着雨幕里那人的背影。鬓边几缕碎发被细雨沾湿，贴在耳畔
  服饰:
    外衣: 藕荷刻丝银线褙子,直领对襟,开衩至腰下,起花八团,腰身收得极窄,袖口和裙摆下沿微微洇了一片水色
    内搭: 月白软烟罗中衣领口滚一道银线,襟口微敞,锁骨若隐若现,胸前衣料撑起圆润弧度,衣襟处沾了几点细密的雨珠
    贴身层: 藕荷绸肚兜藕带系于颈后,裙内不着裈,以裳蔽体,尽掩于层层裙衫之下,不见分毫
    下装: 浅紫百褶裙腰头束紧,腰身盈盈一握,裙摆绣白兰,边缘微湿
    鞋袜: 藕荷罗袜齐踝,浅紫绣鞋绣紫莲,鞋面浅了一点雨星,尚不算湿透
    发饰: 云髻高绾,紫玉簪簪头雕莲花,鬓边一枝鹅黄绒花沾了几颗雨珠
    配饰: 腰系浅金宫绦垂一块羊脂玉佩
  姿势: 持伞立在桥亭亭柱旁,手指仍搭在伞柄上,望着雨幕里那人的背影
  心理: 千年之恩未报，又欠一把伞，须寻由头还他
小青:
  当前位置: 西湖断桥
  好感度: 20
  外貌: 一张瓜子脸,眉眼灵动,笑起来颊边两个浅梨涡。瞳色刻意收敛装作寻常乌眼,只眼尾微微泛着一点翠色,像是戴了副薄薄的碧色琉璃目。方才催伞那一嗓子喊得又急又脆,此刻撇着嘴,面上还带着几分促狭。发梢上挂着几滴细雨
  服饰:
    外衣: 鹅黄蝉翼纱褙子薄如蝉翼,风一过便掀起来,领口敞着未系,衣带松松挽个结,衫子上星星点点沾了几点雨珠
    内搭: 鹅黄细葛衫交领,袖口挽起半截,衣料绷在胸前鼓鼓撑起
    贴身层: 鹅黄绸肚兜,裙内不着裈,以裳蔽体,被外衫罗裙层层掩住,不见分毫
    下装: 鹅黄细葛裙裙摆垂落,边缘浅沾雨星,衣料轻盈不显湿重
    鞋袜: 绣鞋鹅黄面绣黄蝶,鞋面微湿。脚踝处用罗袜掩了大半那圈淡淡的青鳞纹,只余一线若隐若现
    发饰: 发髻松松挽着几缕青丝,鬓边一枝银钗雕成蝴蝶模样,钗头挂着几颗雨珠
    配饰: 腕上一只细银镯沾了点水渍
  姿势: 站在姐姐半步之后,歪着头打量雨里那个借出伞就跑的身影
  心理: 伞借与人转头就跑，也不图谢，这呆子
