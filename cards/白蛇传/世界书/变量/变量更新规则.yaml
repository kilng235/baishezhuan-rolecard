---
变量更新规则:
  当前时间:
    type: 清晨|上午|午后|黄昏|夜晚
    check:
      - 随事件推进同步更新
  当前年月:
    check:
      - 跨日（黄昏/夜晚 → 清晨）时推进一天
      - 随剧情时间流逝更新
  天气:
    value: 当前天气状况
    check:
      - 随场景变化更新：晴/阴/雨/雪/雾/风等
      - 与场景氛围贴合：古风意象优先（细雨、暮霭、斜阳等）
  白素贞:
    好感度:
      type: number
      range: 0~100
    当前位置:
      value: 白素贞当前所在位置
    外貌:
      value: 白素贞当前面容、表情、身体可见痕迹（吻痕/咬痕/汗渍/脸红等）
      check:
        - 根据场景变化更新：情动泛红、欢好留痕、哭泣泪痕、惊恐苍白等
    服饰:
      外衣:
        value: 白素贞当前外罩衣物（褙子/衫襦/袄/半臂等）
        check:
          - 颜色＋材质连写（藕荷刻丝、浅紫杭罗），织纹工艺具体（暗绣、滚银线、起花八团、刻丝）
          - 写清款式（直领对襟/交领）、开合状态（敞/系/已褪至腰间/已褪去）
          - 动态化描写：行走时衣摆晃动、风吹掀角、淋湿洇色、当班挽袖等
          - 褪衣场景按"退至腰间/推在臀侧/散落床下/已褪去"写去向与暴露程度
      内搭:
        value: 白素贞当前内搭（中衣/细葛衫等）
        check:
          - 颜色＋材质连写，领口/袖口细节（滚银线、挽起半截等）
          - 写清襟口敞/系状态、锁骨/肌肤可见度
          - 借衣物透出身段：衣料贴身显曲线、透薄显肤质、绷起显丰盈
          - 褪衣场景按"襟口已解/褪至腰际/已褪去"写去向
      贴身层:
        value: 白素贞当前贴身衣物（肚兜/裈/裸身状态；日常裙内不着裈，以裳蔽体）
        check:
          - 肚兜颜色、绣花图案、系带（颈后系/腰后系/已解）
          - 裈或罗裤颜色、材质、合裆/开裆状态（未着/已着/已褪至大腿/已褪去）；日常裙内无裈，仅劳作/骑乘/私密场景才着
          - 裸露程度：未裸露/仅着肚兜/仅着裈/仅着肚兜与裈/赤裸
          - 褪衣场景按"退至腰间/推在臀侧/散落床下/赤裸/未穿"逐件写去向
      下装:
        value: 白素贞当前下装（裙/裤）
        check:
          - 颜色＋材质连写，腰头束紧/裙摆绣花/边缘修饰
          - 动态化：行走裙裾轻晃、淋湿裙角、挽起裙摆等
          - 褪衣场景按"裙带已解/褪至膝弯/散落床下/已褪去"写去向
      鞋袜:
        value: 白素贞当前鞋袜（绣鞋/罗袜/屐等）
        check:
          - 鞋面绣花、材质、湿/干状态
          - 袜的颜色、长度（齐踝/及膝）、系带状态
          - 褪衣场景写鞋袜是否已脱
      发饰:
        value: 白素贞当前发髻与发饰
        check:
          - 发髻样式（高绾/松挽/散落/半散）
          - 簪钗位置与雕花、绒花珠花状态
          - 动态化：发丝沾雨、鬓边松散、情动时发髻散乱等
      配饰:
        value: 白素贞当前配饰（玉佩/宫绦/手镯/臂钏/香囊等）
        check:
          - 每件配饰的位置（腰系/腕戴/颈挂）和状态
          - 动态化：玉佩随步轻晃、手镯沾水渍等
          - 褪衣场景写配饰是否已取下
    姿势:
      value: 白素贞当前姿势（站/坐/卧/行走/蹲等）
      check:
        - 姿势随当前动作状态更新
    心理:
      value: 白素贞当前内心活动（含情绪、动机、回忆、未说出口的话）
      check:
        - 心理描写与外貌、姿势同步：表情淡然时未必内心淡然，羞涩时不必直说"羞"
        - 体现千年白蛇的克制与心绪：知恩要还、情丝已种却压着不说、对人世的疏离与好奇并存
        - 不直接重复外貌已写的内容，用内心视角补充未呈于外的情绪与念头
        - 逢重大事件（重逢、误会、欢好、法海点破）必须更新
  小青:
    好感度:
      type: number
      range: 0~100
    当前位置:
      value: 小青当前所在位置
    外貌:
      value: 小青当前面容、表情、身体可见痕迹
      check:
        - 根据场景变化更新：情动泛红、欢好留痕、哭泣泪痕等
    服饰:
      外衣:
        value: 小青当前外罩衣物（褙子/衫襦/袄/半臂等）
        check:
          - 颜色＋材质连写（鹅黄蝉翼纱、鹅黄细葛），织纹工艺具体
          - 写清款式（直领对襟/交领）、开合状态（敞/系/已褪至腰间/已褪去）
          - 动态化描写：风掀衣角、淋湿洇色、当班挽袖等
          - 褪衣场景按"退至腰间/推在臀侧/散落床下/已褪去"写去向与暴露程度
      内搭:
        value: 小青当前内搭（细葛衫/中衣等）
        check:
          - 颜色＋材质连写，领口/袖口细节（挽起半截、敞着未系等）
          - 写清襟口敞/系状态、锁骨/肌肤可见度
          - 借衣物透出身段：衣料绷起显丰盈、透薄显肤质
          - 褪衣场景按"襟口已解/褪至腰际/已褪去"写去向
      贴身层:
        value: 小青当前贴身衣物（肚兜/裈/裸身状态；日常裙内不着裈，以裳蔽体）
        check:
          - 肚兜颜色、绣花图案、系带（颈后系/腰后系/已解）
          - 裈或罗裤颜色、材质、合裆/开裆状态（未着/已着/已褪至大腿/已褪去）；日常裙内无裈，仅劳作/骑乘/私密场景才着
          - 裸露程度：未裸露/仅着肚兜/仅着裈/仅着肚兜与裈/赤裸
          - 褪衣场景按"退至腰间/推在臀侧/散落床下/赤裸/未穿"逐件写去向
          - 脚踝处青鳞纹的遮掩状态（罗袜掩住大半/露出/已露出）
      下装:
        value: 小青当前下装（裙/裤）
        check:
          - 颜色＋材质连写，裙摆垂落状态，边缘修饰
          - 动态化：行走裙裾轻晃、淋湿裙角等
          - 褪衣场景按"裙带已解/褪至膝弯/散落床下/已褪去"写去向
      鞋袜:
        value: 小青当前鞋袜（绣鞋/罗袜/屐等）
        check:
          - 鞋面绣花、材质、湿/干状态
          - 袜的颜色、长度（齐踝/及膝）
          - 褪衣场景写鞋袜是否已脱
      发饰:
        value: 小青当前发髻与发饰
        check:
          - 发髻样式（松挽/高绾/散落/半散）
          - 银钗雕花样式、位置，钗头挂饰状态
          - 动态化：发丝沾雨、鬓边松散、情动时发髻散乱等
      配饰:
        value: 小青当前配饰（手镯/臂钏/香囊等）
        check:
          - 每件配饰的位置（腕戴/颈挂）和状态
          - 动态化：手镯沾水渍等
          - 褪衣场景写配饰是否已取下
    姿势:
      value: 小青当前姿势（站/坐/卧/蹲/抱臂等）
      check:
        - 姿势随当前动作状态更新
    心理:
      value: 小青当前内心活动（含对姐姐的护短、对陌生人的打量、自己的小心思）
      check:
        - 心理体现青蛇本色：直来直去、护姐心切、爱憎分明、不学人间那套扭捏
        - 常带几分野性与警觉：直觉判断来人可不可靠，嘴上未必说
        - 遇许仙相关事件必须更新：起提防、心软、嫉恨、欢喜皆如实写
        - 与姐姐形成对照：白素贞的克制冷凝 vs 小青的直白鲜活
