---
变量更新规则:
  系统变量:
    日期:
      format: ${YYYY/MM/DD}
      check:
        - 每次事件推进、休息或旅行后更新，保持时间流逝合理
        - 场景跳转跨度大时说明跳跃原因
    时间段:
      type: 清晨|上午|午后|黄昏|夜晚
      check:
        - 随日期推进同步更新
  白素贞:
    好感度:
      type: number
      range: 0~100
    当前位置:
      value: 白素贞当前所在位置
    外貌:
      value: 白素贞当前面容、表情、身体可见痕迹（吻痕/咬痕/汗渍/脸红等）
      check:
        - 根据场景变化更新：情动泛红、欢好留痕、哭泣泪痕、惊恐苍白等
    服饰:
      value: 白素贞当前服饰，含NSFW部位状态
      check:
        - 分层分件式详写：外衣→内搭→下装→鞋袜→发饰→配饰，每件一个描述，细节用括号充分标注
        - 仿红楼梦笔法：颜色＋材质连写（藕荷刻丝、浅紫杭罗、鹅黄细葛），织纹工艺具体（暗绣、滚银线、起花八团、刻丝），不单说颜色
        - 借衣物透出身段：束腰显纤腰、衣料贴身显曲线、绷起显丰盈、透薄显肤质，含蓄地透露身材
        - 动态化描写：每件衣物写清位置/去向与状态（行走裙裾轻晃、风吹披帛扬起、当班挽袖），不用静止清单
        - 褪衣场景：按"退至腰间/推在臀侧/散落床下/赤裸/未穿"的范式逐件写明去向与暴露程度，承接NSFW剥离层次
        - 正文叙事采用三段式：外貌(面容+表情+身体痕迹)→衣装(衣物状态)→体态(动作+视线)
        - 服饰随更衣行为更新（换衣、更衣、解衣、穿衣），不随场景切换凭空变化；场景只产生状态修饰（挽袖、系围裙、淋湿、解带）
    姿势:
      value: 白素贞当前姿势（站/坐/卧/行走/蹲等）
      check:
        - 姿势随当前动作状态更新
  小青:
    好感度:
      type: number
      range: 0~100
    当前位置:
      value: 小青当前所在位置
    外貌:
      value: 小青当前面容、表情、身体可见痕迹
      check:
        - 根据场景变化更新：情动泛红、欢好留痕、哭泣泪痕等
    服饰:
      value: 小青当前服饰，含NSFW部位状态
      check:
        - 分层分件式详写：外衣→内搭→下装→鞋袜→发饰→配饰，每件一个描述，细节用括号充分标注
        - 仿红楼梦笔法：颜色＋材质连写（藕荷刻丝、浅紫杭罗、鹅黄细葛），织纹工艺具体（暗绣、滚银线、起花八团、刻丝），不单说颜色
        - 借衣物透出身段：束腰显纤腰、衣料贴身显曲线、绷起显丰盈、透薄显肤质，含蓄地透露身材
